[project]
name = "nomi-auth-plugin"
version = "0.1.0"
description = "Single-group QQ registration for Nomi Auth"
requires-python = ">=3.10,<4"
dependencies = ["nonebot2>=2.5,<3", "nonebot-adapter-qq>=1.7.3,<2", "httpx>=0.28,<1"]

[dependency-groups]
dev = [
    "fastapi>=0.143.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomi_auth_plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
extend-ignore = ["B008"]
