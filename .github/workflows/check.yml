name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-neo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NomiTeam/nomi-auth-neo
          ref: 99e0210c61f4d06f61064538c33ef5d667a7b301
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: neo-integration-binary
          path: target/release/nomi-auth-neo
          retention-days: 1

  check:
    needs: build-neo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test-only-root
          MARIADB_DATABASE: nomi_auth_test_plugin_ci
          MARIADB_USER: nomi_auth_test_user
          MARIADB_PASSWORD: test-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOMI_TEST_NEO_BINARY: ${{ github.workspace }}/.reference/neo-bin/nomi-auth-neo
      NOMI_TEST_MYSQL_DATABASE: nomi_auth_test_plugin_ci
      NOMI_TEST_MYSQL_USER: nomi_auth_test_user
      NOMI_TEST_MYSQL_PASSWORD: test-only-password
      NOMI_TEST_MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neo-integration-binary
          path: .reference/neo-bin
      - run: chmod +x .reference/neo-bin/nomi-auth-neo
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Configure isolated database port
        run: echo "NOMI_TEST_MYSQL_PORT=${{ job.services.mariadb.ports[3306] }}" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyrefly check
      - run: uv run pytest -q

  mysql:
    needs: build-neo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-root
          MYSQL_DATABASE: nomi_auth_test_plugin_mysql_ci
          MYSQL_USER: nomi_auth_test_user
          MYSQL_PASSWORD: test-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-only-root --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOMI_TEST_NEO_BINARY: ${{ github.workspace }}/.reference/neo-bin/nomi-auth-neo
      NOMI_TEST_MYSQL_DATABASE: nomi_auth_test_plugin_mysql_ci
      NOMI_TEST_MYSQL_USER: nomi_auth_test_user
      NOMI_TEST_MYSQL_PASSWORD: test-only-password
      NOMI_TEST_MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neo-integration-binary
          path: .reference/neo-bin
      - run: chmod +x .reference/neo-bin/nomi-auth-neo
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Configure isolated database port
        run: echo "NOMI_TEST_MYSQL_PORT=${{ job.services.mysql.ports[3306] }}" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run pytest -q tests/test_integration.py
